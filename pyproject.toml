[project]
name = "zcode-usage"
version = "0.3.0"
description = "Read-only usage reporting for ZCode's local SQLite database (zero-dep CLI + PySide6 desktop app)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7"]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
